name: Markfops

options:
  bundleIdPrefix: com.markfops
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  defaultLocalization: en

packages:
  libcmark_gfm:
    url: https://github.com/KristopherGBaker/libcmark_gfm
    branch: master
  swift-collections:
    url: https://github.com/apple/swift-collections
    from: "1.0.0"
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.0.0"

schemes:
  Markfops:
    build:
      targets:
        Markfops: all
      postActions:
        - name: Stamp built Info.plist with git version
          script: |
            set -e
            PLIST="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
            # The release workflow passes MARKETING_VERSION/CURRENT_PROJECT_VERSION
            # explicitly; when it does, those win and this stamp stays out of the way.
            if [ "$MARKETING_VERSION" != "0.0.0" ]; then exit 0; fi
            DESC=$(git -C "$SRCROOT" describe --tags --long --always 2>/dev/null || echo "v0.0.0-0-g0000000")
            VER=$(printf '%s' "$DESC" | sed -E 's/^v?([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
            COUNT=$(printf '%s' "$DESC" | sed -E 's/^v?[0-9]+\.[0-9]+\.[0-9]+-([0-9]+)-.*/\1/')
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VER" "$PLIST"
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $COUNT" "$PLIST"
          settingsTarget: Markfops
    run:
      config: Debug
    profile:
      config: Debug
    analyze:
      config: Debug
    archive:
      config: Release
  MarkfopsTests:
    build:
      targets:
        MarkfopsTests: [test]
    test:
      config: Debug
      targets:
        - MarkfopsTests

targets:
  Markfops:
    type: application
    platform: macOS
    # XcodeGen has no `resources:` target key — everything bundled must come through
    # `sources:`. Excluding Assets.xcassets here previously meant it was never compiled,
    # so the app shipped with no icon. Preview CSS is inlined in HTMLTemplate.swift.
    sources:
      - path: Markfops
        excludes:
          - Resources/preview-light.css
          - Resources/preview-dark.css
          - Resources/Info.plist
          - Resources/Markfops.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.markfops.Markfops
        # Placeholder values only: the "Stamp built Info.plist with git version"
        # script phase overwrites them in the built bundle from the newest git
        # tag (v1.2.3 -> 1.2.3, commit count since the tag as the build number).
        # The release workflow overrides both explicitly, so tagged GitHub
        # builds are unaffected.
        MARKETING_VERSION: "0.0.0"
        CURRENT_PROJECT_VERSION: "0"
        SWIFT_VERSION: "5.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        CODE_SIGN_ENTITLEMENTS: $(MARKFOPS_CODE_SIGN_ENTITLEMENTS)
        MARKFOPS_CODE_SIGN_ENTITLEMENTS: Markfops/Resources/Markfops.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_ALLOW_ENTITLEMENTS_MODIFICATION: YES
    info:
      path: Markfops/Resources/Info.plist
      properties:
        CFBundleName: Markfops
        CFBundleDisplayName: Markfops
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleIconFile: AppIcon
        CFBundleDocumentTypes:
          - CFBundleTypeName: Markdown Document
            LSItemContentTypes:
              - net.daringfireball.markdown
              - public.plain-text
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            CFBundleTypeExtensions:
              - md
              - markdown
              - txt
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        SUEnableAutomaticChecks: true
        SUFeedURL: https://lpfchan.github.io/Markfops/appcast.xml
        SUPublicEDKey: KZjcrANd2+I475/JYRziHeQpM+NT9zE6NvD5QWjcozs=
    dependencies:
      - package: libcmark_gfm
        product: libcmark_gfm
      - package: swift-collections
        product: Collections
      - package: Sparkle
        product: Sparkle
  MarkfopsTests:
    type: bundle.unit-test
    platform: macOS
    sources: MarkfopsTests
    dependencies:
      - target: Markfops
    settings:
      base:
        SWIFT_VERSION: "5.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
