name: Release

# Trigger: push a version tag, e.g. `git tag v1.0.0 && git push origin v1.0.0`
on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    uses: ./.github/workflows/build.yml

  release:
    needs: build
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # DMG packaging: https://github.com/saihgupr/DMGMaker (CLI — pinned for reproducible CI)
      - name: Checkout DMGMaker
        uses: actions/checkout@v4
        with:
          repository: saihgupr/DMGMaker
          ref: v1.0.3
          path: dmgtool

      - name: Add custom-background CLI support to DMGMaker
        run: git -C dmgtool apply --unidiff-zero "$GITHUB_WORKSPACE/Packaging/DMGMaker-v1.0.3.patch"

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      # Sparkle compares CFBundleVersion between releases, so the tag must reach the bundle.
      # Without this the app would report the hardcoded project.yml version forever and
      # never see itself as out of date.
      - name: Derive version from tag
        run: |
          set -euo pipefail
          APP_VERSION="${GITHUB_REF_NAME#v}"
          BUILD_NUMBER=$(git rev-list --count HEAD)
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"

      # Ad-hoc signing (CODE_SIGN_IDENTITY="-") seals the bundle and its embedded Sparkle
      # XPC services. The release-only entitlement permits the hardened app to load Sparkle
      # because ad-hoc signatures do not provide a shared Apple Team ID.
      - name: Build & Archive
        run: |
          xcodebuild archive \
            -project Markfops.xcodeproj \
            -scheme Markfops \
            -destination "generic/platform=macOS" \
            -archivePath "$RUNNER_TEMP/Markfops.xcarchive" \
            MARKETING_VERSION="$APP_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            MARKFOPS_CODE_SIGN_ENTITLEMENTS=Packaging/MarkfopsAdHoc.entitlements \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES

      - name: Verify signature, entitlement, version, and launch
        run: |
          set -euo pipefail
          APP=$(find "$RUNNER_TEMP/Markfops.xcarchive" -name "Markfops.app" | head -1)
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign --display --xml --entitlements - "$APP" > "$RUNNER_TEMP/Markfops.entitlements"
          test "$(/usr/libexec/PlistBuddy -c "Print :com.apple.security.cs.disable-library-validation" "$RUNNER_TEMP/Markfops.entitlements")" = "true"
          ACTUAL=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Contents/Info.plist")
          test "$ACTUAL" = "$APP_VERSION" || { echo "::error::bundle version $ACTUAL != tag $APP_VERSION"; exit 1; }
          LAUNCH_LOG="$RUNNER_TEMP/Markfops-launch.log"
          "$APP/Contents/MacOS/Markfops" >"$LAUNCH_LOG" 2>&1 &
          APP_PID=$!
          for _ in {1..10}; do
            sleep 0.5
            if ! kill -0 "$APP_PID" 2>/dev/null; then
              wait "$APP_PID" || true
              cat "$LAUNCH_LOG"
              echo "::error::Markfops exited during the launch smoke test."
              exit 1
            fi
          done
          kill "$APP_PID"
          wait "$APP_PID" || true

      - name: Build DMG (DMGMaker)
        run: |
          set -euo pipefail
          APP=$(find "$RUNNER_TEMP/Markfops.xcarchive" -name "Markfops.app" | head -1)
          VERSION="${GITHUB_REF_NAME}"
          STAGING="$RUNNER_TEMP/dmg-staging"
          mkdir -p "$STAGING"
          ditto "$APP" "$STAGING/Markfops.app"
          cd dmgtool
          swift run -c release "DMG Maker" \
            --app "$STAGING/Markfops.app" \
            --name "Markfops-${VERSION}" \
            --background "$GITHUB_WORKSPACE/Packaging/DMGBackground.png"
          DMG="$STAGING/Markfops-${VERSION}.dmg"
          test -f "$DMG"
          echo "DMG_PATH=$DMG" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.DMG_PATH }}
          generate_release_notes: true
          body: |
            ## Installation

            1. Download `Markfops-${{ github.ref_name }}.dmg` and open it
            2. Drag **Markfops** into **Applications**
            3. Open Markfops. macOS will refuse the first launch because the app is not
               notarized by Apple.
            4. Go to **System Settings → Privacy & Security**, scroll to the bottom, and
               click **Open Anyway** next to the Markfops message, then launch it again.

            > On macOS Sequoia and later, right-clicking → Open no longer bypasses this.
            > The **Open Anyway** button only appears for about an hour after a blocked launch.

            If you would rather clear the quarantine flag from Terminal:
            ```
            xattr -dr com.apple.quarantine /Applications/Markfops.app
            ```

      # Must match Sparkle SPM pin in Package.resolved (generate_appcast / sign_update)
      - name: Publish Sparkle appcast to GitHub Pages
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SPARKLE_PRIVATE_KEY:-}" ]; then
            echo "::error::Repository secret SPARKLE_PRIVATE_KEY is not set (export with Sparkle generate_keys -x, then gh secret set)."
            exit 1
          fi
          SPARKLE_VER=2.9.0
          curl -sL "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VER}/Sparkle-${SPARKLE_VER}.tar.xz" | tar -xJf - -C "$RUNNER_TEMP" bin
          VERSION="${GITHUB_REF_NAME}"
          ARCHIVE_DIR="$RUNNER_TEMP/sparkle-archives"
          mkdir -p "$ARCHIVE_DIR"
          cp "$DMG_PATH" "$ARCHIVE_DIR/Markfops-${VERSION}.dmg"
          cp docs/appcast.xml "$ARCHIVE_DIR/appcast.xml"
          # Localized Sparkle release notes (Markdown): basename.<lang>.md — see Sparkle publishing docs
          PKG="Packaging/Sparkle"
          cp "$PKG/ReleaseNotes.md" "$ARCHIVE_DIR/Markfops-${VERSION}.md"
          cp "$PKG/ReleaseNotes.md" "$ARCHIVE_DIR/Markfops-${VERSION}.en.md"
          cp "$PKG/ReleaseNotes.ko.md" "$ARCHIVE_DIR/Markfops-${VERSION}.ko.md"
          cp "$PKG/ReleaseNotes.ja.md" "$ARCHIVE_DIR/Markfops-${VERSION}.ja.md"
          cp "$PKG/ReleaseNotes.zh.md" "$ARCHIVE_DIR/Markfops-${VERSION}.zh.md"
          DOWNLOAD_PREFIX="https://github.com/${{ github.repository }}/releases/download/${VERSION}/"
          NOTES_PREFIX="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/sparkle/"
          echo "$SPARKLE_PRIVATE_KEY" | "$RUNNER_TEMP/bin/generate_appcast" --ed-key-file - \
            --download-url-prefix "$DOWNLOAD_PREFIX" \
            --release-notes-url-prefix "$NOTES_PREFIX" \
            --maximum-versions 0 \
            "$ARCHIVE_DIR"
          rm -rf dmgtool
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p docs/sparkle
          cp "$ARCHIVE_DIR/appcast.xml" docs/appcast.xml
          cp "$ARCHIVE_DIR"/Markfops-${VERSION}*.md docs/sparkle/
          LOG_AGENT="github-actions-release"
          LOG_SUFFIX=$(printf '%s' "$LOG_AGENT" | tr '[:upper:]' '[:lower:]' | tr -cd '[:alnum:]' | awk '{len=length($0); if (len <= 6) print $0; else print substr($0, len - 5)}')
          LOG_SEEN=$(git log --all --format=%B | sed -n 's/^commit: //p' | tr ',' '\n' | sed 's/^ *//; s/ *$//' | sort -u)
          LOG_EPOCH=$(TZ=Asia/Seoul date +%s)
          while :; do
            LOG_STAMP=$(TZ=Asia/Seoul date -r "$LOG_EPOCH" +%Y%m%d-%H%M%S)
            LOG_ID="LOG-${LOG_STAMP}-${LOG_SUFFIX}"
            if ! printf '%s\n' "$LOG_SEEN" | grep -Fxq "$LOG_ID"; then
              break
            fi
            LOG_EPOCH=$((LOG_EPOCH + 1))
          done
          LOG_OPENED=$(TZ=Asia/Seoul date '+%Y-%m-%d %H-%M-%S KST')
          LOG_FILE="$RUNNER_TEMP/${LOG_ID}.commit-message"
          cat <<EOF | sed 's/^          //' > "$LOG_FILE"
          Publish Sparkle appcast and release notes for ${VERSION}

          timestamp: ${LOG_OPENED}
          changes:
          - generated and published the Sparkle appcast and localized release notes for ${VERSION}
          - updated GitHub Pages release metadata for ${VERSION}
          rationale:
          - release publishing should leave commit-backed execution history instead of a parallel markdown file layer
          - Sparkle metadata and localized release notes need to land together on main
          checks:
          - release workflow archive
          - DMG build
          - Sparkle appcast generation
          notes:
          - legacy markdown execution-history output is retired; execution history is recorded by the commit itself

          project: markfops
          agent: github-actions-release
          role: worker
          commit: ${LOG_ID}
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/appcast.xml "docs/sparkle/Markfops-${VERSION}.md" "docs/sparkle/Markfops-${VERSION}.en.md" \
            "docs/sparkle/Markfops-${VERSION}.ko.md" "docs/sparkle/Markfops-${VERSION}.ja.md" "docs/sparkle/Markfops-${VERSION}.zh.md"
          git diff --staged --quiet || git commit -F "$LOG_FILE"
          git push origin main
